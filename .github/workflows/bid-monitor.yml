name: Bid Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: write

concurrency:
  group: bid-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CHECK_DAYS: ${{ secrets.CHECK_DAYS }}
      SEND_TELEGRAM: ${{ secrets.SEND_TELEGRAM }}
      SEND_EMPTY_SUMMARY: ${{ secrets.SEND_EMPTY_SUMMARY }}
      DOCUMENT_TIMEOUT: 8
      MAX_DOCUMENT_DOWNLOADS: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Apply runtime defaults
        shell: bash
        run: |
          echo "CHECK_DAYS=${CHECK_DAYS:-3}" >> "$GITHUB_ENV"
          echo "SEND_TELEGRAM=${SEND_TELEGRAM:-true}" >> "$GITHUB_ENV"
          echo "SEND_EMPTY_SUMMARY=${SEND_EMPTY_SUMMARY:-false}" >> "$GITHUB_ENV"
          echo "DOCUMENT_TIMEOUT=${DOCUMENT_TIMEOUT:-8}" >> "$GITHUB_ENV"
          echo "MAX_DOCUMENT_DOWNLOADS=${MAX_DOCUMENT_DOWNLOADS:-3}" >> "$GITHUB_ENV"
          echo "SQLITE_PATH=data/bids.sqlite" >> "$GITHUB_ENV"

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in DATA_GO_KR_SERVICE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done

          send_telegram="$(printf '%s' "$SEND_TELEGRAM" | tr '[:upper:]' '[:lower:]')"
          if [ "$send_telegram" != "false" ]; then
            for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
              if [ -z "${!name}" ]; then
                echo "::error::$name is not configured"
                missing=1
              fi
            done
          fi

          exit "$missing"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure runtime state directory exists
        shell: bash
        run: mkdir -p state

      - id: monitor
        name: Run bid monitor
        run: python main.py

      - name: Commit runtime state
        if: ${{ always() && steps.monitor.outcome != 'skipped' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add state/sent_bids.json state/health.json

          if git diff --cached --quiet; then
            echo "No runtime state changes to commit."
            exit 0
          fi

          git commit -m "Update bid monitor runtime state"
          git pull --rebase
          git push
